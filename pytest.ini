[pytest]
# Descubrimiento de las tres suites (los archivos se llaman pruebas*.py, no test_*.py).
#   python -m pytest estructuras                 estructuras de datos (sin requisitos)
#   python -m pytest bd                          procedimientos, vistas y DW sobre una copia desechable de SIPA
#   python -m pytest tablero/pruebas_e2e.py      tablero local sobre una copia desechable de SIPA
#   python -m pytest tablero/pruebas_sitio.py    sitio estático (python -m http.server 8000 --directory docs)
testpaths = estructuras bd tablero
python_files = pruebas.py pruebas_*.py
python_classes = Prueba*
python_functions = test_*
addopts = -p no:cacheprovider
